    <style>
      /* Splash Screen Estilo UX */
      #justino-loader {
        position: fixed;
        inset: 0;
        background: #0F172A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body class="bg-slate-50 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Splash Screen que desaparece cuando React carga -->
    <div id="justino-loader">
        <div class="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-4"></div>
        <p class="text-emerald-500 font-mono text-xs tracking-widest uppercase animate-pulse">Iniciando Protocolos Legales...</p>
    </div>

    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>

    <script>
      // Remover loader una vez que el DOM de React se haya montado
      window.addEventListener('load', () => {
        const loader = document.getElementById('justino-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }, 300);
        }
      });
    </script>
  </body>
